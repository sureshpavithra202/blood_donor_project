<!DOCTYPE html>
<html>
<head>
    <title>Add Donor - Blood Donor Finder</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
        }

        .header {
            background: #b71c1c;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .form-box {
            background: white;
            width: 90%;
            max-width: 500px;
            margin: 35px auto;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 10px #ccc;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input {
            width: 95%;
            padding: 11px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 12px;
            background: #b71c1c;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 15px;
            color: #b71c1c;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>🩸 Add Blood Donor</h1>
        <p>Register as a blood donor</p>
    </div>

    <div class="form-box">

        <form method="POST">
            {% csrf_token %}

            <label>Name</label>
            <input type="text" name="name" required>

            <label>Blood Group</label>
            <input type="text" name="blood_group"
                   placeholder="Example: O+" required>

            <label>Phone</label>
            <input type="text" name="phone" required>

            <label>City</label>
            <input type="text" name="city" required>

            <label>Availability</label>
            <select name="available">
                 <option value="True">Available</option>
                  <option value="False">Not Available</option>
            </select>

            <button type="submit">Add Donor</button>
        </form>

        <a class="back" href="/donors/">
            ← Back to Donor List
        </a>

    </div>

</body>
</html>
